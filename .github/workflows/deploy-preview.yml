name: Vercel Preview Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on: pull_request
jobs:
  Deploy-Preview:
    if: endsWith(github.head_ref, '/base')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
      - name: Install pnpm
        id: pnpm-install
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false
      - name: Install Vercel CLI
        run: pnpm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.TEST_VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.TEST_VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          BRANCH_NAME=$(echo "${{ github.head_ref }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g')
          url="$(vercel deploy --prebuilt --token=${{ secrets.TEST_VERCEL_TOKEN }})"
          alias_url="clean-architecture-example-$BRANCH_NAME.anisotropys-projects.vercel.app"
          vercel alias --token=${{ secrets.TEST_VERCEL_TOKEN }} set "$url" "$alias_url"
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "alias_url=https://$alias_url" >> $GITHUB_OUTPUT
      - name: Comment PR with deployment URLs
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            Preview URL: ${{steps.deploy.outputs.alias_url}} ([Visit](${{steps.deploy.outputs.alias_url}}))
